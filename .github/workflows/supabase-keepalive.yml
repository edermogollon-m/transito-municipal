# Supabase pausa los proyectos gratuitos tras 7 días sin actividad.
# Esta consulta periódica mantiene la base de datos activa.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar configuracion
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" config.js)
          KEY=$(grep -o "eyJ[^']*" config.js)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/configuracion?select=id&limit=1" -H "apikey: $KEY")
          echo "HTTP $code"
          test "$code" = "200"
